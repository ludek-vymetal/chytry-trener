name: dart_application_1

description: Moje fitness aplikace pro firmu.

version: 1.0.0

publish_to: "none"

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  path: ^1.9.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.3.2
  share_plus: ^10.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
  file_selector: ^1.0.3
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  uuid: ^4.4.0
  flutter_launcher_icons: ^0.14.4
  path_provider: ^2.1.5
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

flutter_intl:
  enabled: true

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  untranslated-messages-file: untranslated.json

analyzer:
  errors:
    unused_element: ignore
    unused_local_variable: ignore
    use_build_context_synchronously: ignore

linter:
  rules:
    prefer_const_constructors: false